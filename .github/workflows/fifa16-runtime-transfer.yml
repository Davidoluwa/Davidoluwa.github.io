name: FIFA16 sandbox artifact probe

on:
  push:
    branches: [fifa16-runtime-transfer]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Make probe
        run: |
          printf 'FIFA16_ARTIFACT_BRIDGE_OK\n' > probe.txt
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fifa16-artifact-probe
          path: probe.txt
          if-no-files-found: error

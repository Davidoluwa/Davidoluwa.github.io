name: FIFA16 temporary runtime transfer

on:
  push:
    branches: [fifa16-runtime-transfer]

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add verified open-source runtime to temporary static path
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o unicorn.7z https://github.com/unicorn-engine/unicorn/releases/download/2.1.4/ubuntu-cmake-shared-x64.7z
          echo '07841e2df55a6d4ac063017bdfd861f1712083c6f2ffe5fe96973c834cd772dc  unicorn.7z' | sha256sum -c -
          sudo apt-get update >/dev/null
          sudo apt-get install -y p7zip-full >/dev/null
          mkdir unpack runtime_bridge
          7z x unicorn.7z -ounpack >/dev/null
          cp unpack/lib/libunicorn.so.2 runtime_bridge/unicorn-linux-x64-2.1.4.so.2
          sha256sum runtime_bridge/unicorn-linux-x64-2.1.4.so.2 | tee runtime_bridge/SHA256SUMS.txt
          cat > runtime_bridge/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>temporary runtime bridge</title>
          <a href="unicorn-linux-x64-2.1.4.so.2">verified Unicorn 2.1.4 Linux x64 runtime</a>
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_bridge
          git commit -m 'Temporary open-source FIFA16 verification runtime [skip ci]'
          git push origin HEAD:main

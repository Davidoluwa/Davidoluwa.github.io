name: FIFA16 JADX analysis tool artifact

on:
  push:
    branches: [fifa16-runtime-transfer]

jobs:
  jadx:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch JADX 1.5.6
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  jadx.zip' | sha256sum -c -
      - name: Upload JADX
        uses: actions/upload-artifact@v4
        with:
          name: fifa16-jadx-1.5.6
          path: jadx.zip
          compression-level: 0
          if-no-files-found: error
